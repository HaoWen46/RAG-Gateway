name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]

jobs:
  go-test:
    name: Go Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            go-version: "1.24"
          - service: retrieval
            go-version: "1.23"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: go test ./...

  go-vet:
    name: Go Vet (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            go-version: "1.24"
          - service: retrieval
            go-version: "1.23"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: go vet
        working-directory: ${{ matrix.service }}
        run: go vet ./...

  python-test:
    name: Python Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [adapter-service, pageindex-worker]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: uv sync --frozen --extra dev

      - name: Run tests
        working-directory: ${{ matrix.service }}
        run: uv run pytest tests/ -v

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build all images
        run: docker compose build
